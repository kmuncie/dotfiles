# General defaults for all servers.
#
# This file is stow-managed and PUBLIC. Only settings that are safe to publish
# belong here — no hostnames, IPs, usernames, bastions, or jump hosts. Anything
# host-specific or internal stays in ~/.ssh/config, which is deliberately not
# tracked by this repo.
#
# Included from ~/.ssh/config via:
#
#     Include ~/.ssh/config.d/*.conf
#
# Placement matters. SSH is first-match-wins per keyword, so this include sits
# near the BOTTOM of ~/.ssh/config, after the specific Host blocks, exactly
# where the inline `Host *` block used to be. Moving it to the top would let
# these defaults silently override per-host settings.

Host *
   # In general, you want to forward your SSH agent so that you can use the same SSH key
   # to ssh to another server from any server you connect to.
   AddKeysToAgent yes
   ForwardAgent yes
   ServerAliveInterval 60
   # Keys are served by the 1Password SSH agent rather than files on disk, so no
   # IdentityFile entries are needed here.
   IdentityAgent "~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"

   # Suppresses the long login banner that some managed servers print on connect.
   LogLevel QUIET
